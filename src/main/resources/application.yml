server:
  port: 8080

spring:
  application:
    name: starter-api

# Actuator Endpoints for health and metrics monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    root: INFO
    com.example.starter: DEBUG
    org.springframework.web: INFO
